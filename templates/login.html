{% extends 'base.html' %}
{% block title %}Sign In — MediBook{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card">
    <div class="card-title"><i class="fa fa-right-to-bracket"></i> Sign In</div>

    {% if msg %}<div class="alert alert-danger">{{ msg }}</div>{% endif %}

    <form action="{{ url_for('login') }}" method="post">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-control" type="email" name="email" placeholder="Enter Email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" placeholder="Enter Password" required>
      </div>
      <button class="btn btn-primary btn-full" type="submit">
        <i class="fa fa-right-to-bracket"></i> Login
      </button>
    </form>

    <p class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
