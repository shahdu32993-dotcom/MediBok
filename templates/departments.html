{% extends 'base.html' %}
{% block title %}Departments — MediBook{% endblock %}
{% block content %}
<h2 class="section-title">
  <i class="fa fa-building-columns"></i> Our Departments
</h2>
<div class="dept-grid-page">
  {% for dept in departments %}
  <div class="dept-card-page">
    <i class="fa fa-heart-pulse"></i>
    <h3>{{ dept.name }}</h3>
    <p>{{ dept.description }}</p>
    <a href="{{ url_for('book_appointment') }}" class="btn btn-primary btn-sm mt-1">
      <i class="fa fa-calendar-plus"></i> Book Now
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
