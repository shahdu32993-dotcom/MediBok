{% extends 'base.html' %}
{% block title %}Book Appointment — MediBook{% endblock %}
{% block content %}
<div class="book-wrap">
  <div class="card">
    <div class="card-title"><i class="fa fa-calendar-plus"></i> Book Appointment</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Department</label>
        <select name="department_id" class="form-control" required>
          <option value="">— Select Department —</option>
          {% for dept in departments %}
          <option value="{{ dept.id }}">{{ dept.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Doctor</label>
        <select name="doctor_id" class="form-control" required>
          <option value="">— Select Doctor —</option>
          {% for doc in doctors %}
          <option value="{{ doc.id }}">{{ doc.name }}{% if doc.specialty %} — {{ doc.specialty }}{% endif %}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-btn-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" name="date" class="form-control" min="{{ today }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Time</label>
          <input type="time" name="time" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Reason for Visit</label>
        <textarea name="reason" class="form-control" rows="3" placeholder="Describe your symptoms or reason..."></textarea>
      </div>
      <div class="form-btn-row">
        <button type="submit" class="btn btn-primary" >
          <i class="fa fa-calendar-check"></i> Confirm Booking
        </button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary" >
          Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
