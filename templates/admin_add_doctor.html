{% extends 'base.html' %}
{% block title %}Add Doctor — MediBook{% endblock %}
{% block content %}

<div class="page-header">
  <h1 class="page-title"><i class="fa fa-user-doctor"></i> Add New Doctor</h1>
  <a href="{{ url_for('admin_users') }}" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>
</div>

<div class="book-wrap">
  <div class="card">
    <form method="POST">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Specialty</label>
          <input type="text" name="specialty" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label">Department</label>
          <select name="department_id" class="form-control">
            <option value="">— None —</option>
            {% for dept in departments %}
            <option value="{{ dept.id }}">{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Bio</label>
        <textarea name="bio" class="form-control" rows="3" placeholder="Doctor's biography..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="fa fa-user-plus"></i> Add Doctor
      </button>
    </form>
  </div>
</div>
{% endblock %}
